# Controlled EVSSM/TURTLE ablation on the same preregistered 11 keyframes.
#
# The list is frozen in this config before either arm starts.  It records the
# timestamps observed in the earlier EVSSM baseline, but neither arm reads that
# run's files, metrics, poses, depths, or Gaussian state at runtime.
inherit_from: ../fr2_xyz_official_online_budget_221/common.yaml

paired_official_online_budget_221:
  comparison: fixed_11kf_evssm_vs_official_turtle_gopro_fp16

fixed_kf_frontend_ablation_221:
  schema: unblur_slam.fr2_xyz_fixed_kf_frontend_ablation_221.v1
  purpose: isolate_frontend_from_keyframe_count_and_mapper_budget
  conditional_on_frozen_evssm_baseline_schedule: true
  shares_pose_estimates_between_arms: false
  uses_ground_truth_poses: false
  runtime_baseline_artifact_dependency: false
  provenance_verified_during_cpu_preflight: true
  frozen_baseline_video_npz: /srv/szha0669/unblur-slam/slam_paired/fr2_xyz_official_online_budget_221/evssm_baseline/freiburg2_xyz/video.npz
  frozen_baseline_video_npz_sha256: 39afbe2135480ae77530719f7bab2a5facc1b5fe0e4f2c62f045fafe25802ed8

tracking:
  fixed_source_keyframes:
    enabled: true
    schema: unblur_slam.fixed_source_keyframes.v1
    coordinate_domain: dataset_source_index
    strict_exact: true
    selection_source: frozen_prior_evssm_baseline_schedule
    runtime_baseline_artifact_dependency: false
    uses_ground_truth_poses: false
    source_indices: [0, 9, 15, 49, 58, 72, 89, 109, 125, 166, 220]

data:
  output: /srv/szha0669/unblur-slam/slam_paired/fr2_xyz_fixed_kf_frontend_ablation_221/_common_do_not_run
